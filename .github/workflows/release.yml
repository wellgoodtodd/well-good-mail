# Builds the Windows installer and publishes it, with the signed auto update file, to this repository's Releases.
# Run it from the Actions tab: "Build Windows app" > Run workflow.
# Needs one repository secret: TAURI_SIGNING_PRIVATE_KEY (see SETUP.md). No Google keys are built in:
# the app asks each person for their own key the first time it opens.
name: Build Windows app

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm test

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: v__VERSION__
          releaseName: Well Good Mail v__VERSION__
          releaseBody: Alpha build of Well Good Mail. Download the setup.exe below. The app updates itself after that.
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
